name: Feature request
description: An idea to make osat better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, before the solution. "I keep switching to WinSCP to…" is a great start.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: alternatives
    attributes:
      label: How other tools do it
      description: PuTTY, WinSCP, mRemoteNG, Termius, MobaXterm… if it's relevant.
